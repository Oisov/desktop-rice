general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/oisov/.cache/hypr-wallpaper/current
    reload_time = 2
    reload_cmd = readlink -f /home/oisov/.cache/hypr-wallpaper/current
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 1.0
    brightness = 0.8
    vibrancy = 0.1
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(ffffff33)
    inner_color = rgba(00000033)
    font_color = rgba(ffffffff)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text =
    position = 0, -110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = rgba(ffffffff)
    font_size = 80
    font_family = Barlow Condensed, Light
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = rgba(ffffffff)
    font_size = 80
    font_family = Barlow Condensed, Light
    position = 0, 45
    halign = center
    valign = center
}
