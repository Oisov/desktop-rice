# CachyOS-inspired Hyprland test profile.
# Keep this file small enough to audit while still giving a complete session.

monitor=,preferred,auto,2

$mod = SUPER
$terminal = kitty
$menu = wofi --show drun
$fileManager = dolphin
$wallpaper = /usr/share/wallpapers/MilkyWay/contents/screenshot.png

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = KDE_SESSION_VERSION,6
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

cursor {
    no_hardware_cursors = true
}

exec-once = ~/.local/bin/hypr-startup-apps
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = mako
exec-once = waybar
exec-once = hypridle

input {
    kb_layout = no
    follow_mouse = 1
    sensitivity = 0
    scroll_method = 2fg

    touchpad {
        natural_scroll = false
        tap-to-click = true
        tap-and-drag = true
        drag_lock = true
        scroll_factor = 1.0
        disable_while_typing = false
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(00d4ffee) rgba(7c3aedee) 45deg
    col.inactive_border = rgba(2f3341aa)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 8

    blur {
        enabled = true
        size = 6
        passes = 2
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000055)
    }
}

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, smooth, popin 85%
    animation = border, 1, 5, smooth
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 4, smooth, slide
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

windowrule = match:class ^(vivaldi-snapshot|Vivaldi-snapshot)$, workspace 2
windowrule = match:class ^(Mattermost|mattermost)$, workspace special:mattermost silent

bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, E, exec, $fileManager
bind = $mod, S, togglespecialworkspace, mattermost
bind = $mod SHIFT, S, exec, ~/.local/bin/hypr-mattermost-scratchpad
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, V, togglefloating
bind = $mod, F, exec, ~/.local/bin/hypr-toggle-compositor-fullscreen
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod, B, exec, pkill -SIGUSR1 waybar
bind = $mod, P, pseudo
bind = $mod, L, exec, hyprlock
bind = $mod, Tab, workspace, previous
bind = $mod SHIFT, Tab, focuscurrentorlast
bind = $mod SHIFT, R, exec, hyprctl reload && pkill -SIGUSR2 waybar

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod CTRL, left, resizeactive, -40 0
bind = $mod CTRL, right, resizeactive, 40 0
bind = $mod CTRL, up, resizeactive, 0 -40
bind = $mod CTRL, down, resizeactive, 0 40

bind = , Print, exec, ~/.local/bin/hypr-screenshot
bind = SHIFT, Print, exec, ~/.local/bin/hypr-screenshot region
bind = CTRL, Print, exec, ~/.local/bin/hypr-screenshot full

bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Clipboard history, screenshot annotation and color picker.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
bind = $mod SHIFT, V, exec, cliphist list | rofi -dmenu -p clipboard | cliphist decode | wl-copy
bind = $mod, Print, exec, ~/.local/bin/hypr-screenshot annotate-region
bind = $mod SHIFT, C, exec, hyprpicker -a
